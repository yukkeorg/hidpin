[package]
name = "hidpin"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Host library for hidpin GPIO monitoring devices (RP2040 / RP2350)"
license = "MIT"
repository = "https://github.com/yukkeorg/hidpin"
readme = "README.md"
keywords = ["hid", "gpio", "rp2040", "raspberry-pi-pico"]
categories = ["hardware-support"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
