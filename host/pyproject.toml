[project]
name = "hidpin"
version = "0.1.0"
description = "Host library and CLI for hidpin GPIO monitoring devices (RP2040)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yukke.org" }]
dependencies = ["hidapi>=0.14"]

[project.scripts]
hidpin = "hidpin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hidpin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
